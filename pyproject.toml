[project]
name = "remem"
version = "0.1.0"
description = "Knowledge and memory store for AI coding agents"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon Handeland", email = "brandon@unbuffered.net" }]
keywords = ["mcp", "memory", "knowledge-base", "claude-code", "agents", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
    "platformdirs>=4.11.4",
    "tomli-w>=1.2.0",
]

# Optional, not a hard dependency. It pulls roughly twenty-two transitive
# packages (onnxruntime, huggingface-hub, tokenizers, numpy, pillow, protobuf
# and friends) for about 216MB of venv, and then downloads ~130MB of model
# weights from HuggingFace on first use - and a user who only writes and reads
# entries never needs any of it. `remem embed` says how to install it when it
# is missing; search degrades to two tiers.
[project.optional-dependencies]
embed = ["fastembed>=0.7.0"]

[project.urls]
Homepage = "https://gitlab.com/nighthawk-oss/remem"
Repository = "https://gitlab.com/nighthawk-oss/remem"
Issues = "https://gitlab.com/nighthawk-oss/remem/-/issues"

[project.scripts]
remem = "remem.cli:app"

[project.entry-points."remem.agents"]
claude-code = "remem.agents.claude_code.adapter:ClaudeCodeAdapter"
opencode = "remem.agents.opencode.adapter:OpenCodeAdapter"
cursor = "remem.agents.cursor.adapter:CursorAdapter"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling's "packages" already ships every VCS-tracked file under
# src/remem in the wheel, not just .py files - migrations/*.sql and
# skills/**/SKILL.md are included with no extra config. A force-include
# entry for either path duplicates that and hatchling refuses to build
# ("second file is being added to the wheel archive at the same path").
[tool.hatch.build.targets.wheel]
packages = ["src/remem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a running Postgres (docker compose up -d)",
    "slow: shells out to a real build; skip with -m 'not slow'",
    "opencode: requires opencode's plugin types installed; checks our vendored copy is fresh",
    "cursor: requires Cursor.app installed; checks our vendored copy is fresh",
]
