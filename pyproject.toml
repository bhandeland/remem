[project]
name = "remem"
version = "0.1.0"
description = "Knowledge and memory store for AI coding agents"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
    "platformdirs>=4.11.4",
]

[project.scripts]
remem = "remem.cli:app"

[project.entry-points."remem.agents"]
claude-code = "remem.agents.claude_code.adapter:ClaudeCodeAdapter"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running Postgres (docker compose up -d)"]
