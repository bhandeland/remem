# GitLab CI/CD Pipeline for remem

stages:
  - lint
  - security
  - test
  - publish

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.14"

# Cache uv's download cache and the project venv between jobs
.uv-cache:
  cache:
    key: "$CI_JOB_NAME-$PYTHON_VERSION-v1"
    paths:
      - .cache/uv
      - .cache/pip
      - .venv/

# Base job for Python tasks
.python-base:
  image: python:${PYTHON_VERSION}-slim
  extends: .uv-cache
  before_script:
    - pip install uv
    - uv sync --all-extras

.default-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================================================
# Linting Stage
# =============================================================================

ruff:
  stage: lint
  extends:
    - .python-base
    - .default-rules
  script:
    - uv run ruff check src/ tests/
    - uv run ruff format --check src/ tests/
  # Advisory until ruff is added to the dev group and the tree is clean.
  allow_failure: true

# =============================================================================
# Security Scanning Stage
# =============================================================================

pip-audit:
  stage: security
  extends:
    - .python-base
    - .default-rules
  script:
    - pip install pip-audit
    - uv export --no-hashes --format requirements-txt > requirements.txt
    - pip-audit -r requirements.txt --strict
  allow_failure: true  # Advisory until dependencies are fully audited

# =============================================================================
# Test Stage
# =============================================================================
#
# remem's db-marked tests pytest.skip with an explanatory message when Postgres
# is unreachable, so the suite reports success while never touching the
# database. A green run here would otherwise prove nothing. The service block
# provides Postgres, and the assert-db-ran step below fails the job if any
# db-marked test skipped anyway - a broken service must not read as a pass.

pytest:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  extends:
    - .uv-cache
    - .default-rules
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
  variables:
    POSTGRES_USER: remem
    POSTGRES_PASSWORD: remem
    POSTGRES_DB: remem
    # tests/conftest.py reads REMEM_TEST_DSN, NOT REMEM_DSN - the latter is the
    # runtime setting and setting only it leaves every db test skipping against
    # localhost:5433 while the suite still exits 0.
    REMEM_TEST_DSN: "postgresql://remem:remem@postgres:5432/remem"
  before_script:
    # git: test_project_resolution.py shells out to it; slim images have none.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - pip install uv
    - uv sync --all-extras
  script:
    # Prove Postgres is reachable BEFORE running the suite. The db fixtures
    # pytest.skip when it is not, so without this a broken service block is
    # indistinguishable from a green run - see the 308 skips in pipeline
    # 2802062296. Fail here, loudly, rather than passing on nothing.
    - |
      uv run python - <<'PY'
      import os, sys, psycopg
      dsn = os.environ["REMEM_TEST_DSN"]
      try:
          with psycopg.connect(dsn, connect_timeout=10):
              print(f"Postgres reachable at {dsn}")
      except psycopg.Error as exc:
          sys.exit(f"Postgres NOT reachable at {dsn}: {exc}")
      PY
    - uv run pytest tests/ -v --cov=src/remem --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
    when: always

# =============================================================================
# Publish Stage
# =============================================================================

# Trusted Publishing (OIDC), not a stored API token. PyPI holds a pending
# publisher for nighthawk-oss/remem pinned to this file and to the environment
# name below - all three claims must match or the mint request is refused, so
# renaming the environment here silently breaks publishing.
#
# uv cannot yet perform the GitLab exchange itself (astral-sh/uv#12754), so the
# short-lived id_token is traded for a PyPI API token by hand and passed in.
publish-pypi:
  stage: publish
  image: python:${PYTHON_VERSION}-slim
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install uv
    # python:*-slim ships no curl, so the exchange uses the stdlib. The minted
    # token is short-lived and scoped to this project; it is never persisted.
    - |
      API_TOKEN=$(python - <<'PY'
      import json, os, urllib.request
      req = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      with urllib.request.urlopen(req) as r:
          print(json.load(r)["token"])
      PY
      )
    - uv build
    - uv publish --token "$API_TOKEN"
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: release
    url: https://pypi.org/project/remem/
